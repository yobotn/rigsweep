<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RigSweep</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="bolt">🧹</span> RigSweep<div class="tagline" data-i18n="tagline"></div></div>
    <nav>
      <button data-tab="dashboard" class="active" data-i18n="nav.dashboard"></button>
      <div class="nav-group" data-i18n="nav.g.clean"></div>
      <button data-tab="cleanup" data-i18n="nav.cleanup"></button>
      <button data-tab="disk" data-i18n="nav.disk"></button>
      <button data-tab="browser" data-i18n="nav.browser"></button>
      <div class="nav-group" data-i18n="nav.g.tune"></div>
      <button data-tab="tweaks" data-i18n="nav.tweaks"></button>
      <button data-tab="processes" data-i18n="nav.processes"></button>
      <div class="nav-group" data-i18n="nav.g.pc"></div>
      <button data-tab="hardware" data-i18n="nav.hardware"></button>
      <button data-tab="report" data-i18n="nav.report"></button>
      <div class="nav-group"></div>
      <button data-tab="history" data-i18n="nav.history"></button>
      <button data-tab="settings" data-i18n="nav.settings"></button>
    </nav>
    <div class="side-foot">
      <button id="update-pill" class="pill update hidden"></button>
      <select id="lang-select" aria-label="Language"></select>
      <div id="watchdog-status" class="pill"></div>
      <div id="admin-status" class="pill"></div>
    </div>
  </aside>

  <main>
    <!-- DASHBOARD -->
    <section id="tab-dashboard" class="tab active">
      <header><h1 data-i18n="dash.title"></h1><button id="btn-refresh-dash" class="ghost" data-i18n="common.refresh"></button></header>
      <div class="tiles">
        <div class="tile"><div class="label" data-i18n="dash.cpu"></div><div class="value skel" id="t-cpu">–</div></div>
        <div class="tile"><div class="label" data-i18n="dash.mem"></div><div class="value skel" id="t-mem">–</div></div>
        <div class="tile"><div class="label" data-i18n="dash.procs"></div><div class="value skel" id="t-procs">–</div></div>
        <div class="tile"><div class="label" data-i18n="dash.tweaks"></div><div class="value skel" id="t-tweaks">–</div></div>
        <div class="tile"><div class="label" data-i18n="dash.drift"></div><div class="value skel" id="t-drift">–</div></div>
        <div class="tile heat" id="t-heat-tile" role="button" tabindex="0" data-i18n-title="heat.unitHint">
          <div class="label" data-i18n="heat.title"></div>
          <div class="value skel" id="t-heat">–</div>
          <svg id="heat-spark" class="spark heat-spark" viewBox="0 0 300 28" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="sub" id="t-heat-sub"></div>
        </div>
      </div>
      <div id="heat-callout" class="callouts"></div>
      <div id="hw-callout" class="callouts"></div>
      <div id="dash-callouts" class="callouts"></div>
      <div class="grid2">
        <div class="card">
          <h2 data-i18n="dash.top"></h2>
          <table class="tbl"><thead><tr><th data-i18n="col.process"></th><th class="num" data-i18n="col.cpu"></th><th class="num" data-i18n="col.ram"></th><th class="num" data-i18n="col.disk"></th></tr></thead><tbody id="dash-top"><tr class="skel-row"><td colspan="4"><span class="skel-bar"></span></td></tr><tr class="skel-row"><td colspan="4"><span class="skel-bar"></span></td></tr><tr class="skel-row"><td colspan="4"><span class="skel-bar"></span></td></tr><tr class="skel-row"><td colspan="4"><span class="skel-bar"></span></td></tr><tr class="skel-row"><td colspan="4"><span class="skel-bar"></span></td></tr><tr class="skel-row"><td colspan="4"><span class="skel-bar"></span></td></tr></tbody></table>
        </div>
        <div class="card">
          <h2 data-i18n="dash.recent"></h2>
          <ul id="dash-history" class="feed"><li class="skel-row"><span class="skel-bar"></span></li><li class="skel-row"><span class="skel-bar"></span></li><li class="skel-row"><span class="skel-bar"></span></li><li class="skel-row"><span class="skel-bar"></span></li><li class="skel-row"><span class="skel-bar"></span></li></ul>
        </div>
      </div>
    </section>

    <!-- DEV CLEANUP -->
    <section id="tab-cleanup" class="tab">
      <header>
        <h1 data-i18n="clean.title"></h1>
        <div class="actions">
          <button id="btn-clean-scan" class="ghost" data-i18n="clean.scan"></button>
          <button id="btn-clean-stale" class="ghost" data-i18n="clean.selectStale"></button>
          <button id="btn-clean-end" class="danger" data-i18n="clean.end"></button>
        </div>
      </header>
      <p class="hint" data-i18n="clean.hint"></p>
      <div id="live" class="live">
        <div class="live-nums">
          <div><span class="k" data-i18n="col.ram">RAM</span> <b id="live-mem">–</b></div>
          <div><span class="k" data-i18n="col.cpu">CPU</span> <b id="live-cpu">–</b></div>
          <div id="live-heat-row" class="hidden"><span class="k">🌡</span> <b id="live-heat">–</b></div>
          <div class="sub" data-i18n="live.now"></div>
        </div>
        <svg id="live-spark" class="spark" viewBox="0 0 300 48" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="live-win" class="live-win hidden"></div>
      </div>
      <div id="clean-summary" class="summary"></div>
      <table class="tbl">
        <thead><tr>
          <th></th><th data-i18n="clean.col.what"></th><th data-i18n="clean.col.project"></th>
          <th class="num" data-i18n="clean.col.age"></th><th class="num" data-i18n="clean.col.mem"></th>
          <th data-i18n="clean.col.ports"></th><th data-i18n="clean.col.status"></th>
        </tr></thead>
        <tbody id="clean-body"><tr><td colspan="7" class="loading">…</td></tr></tbody>
      </table>
    </section>

    <!-- DEV DISK -->
    <section id="tab-disk" class="tab">
      <header>
        <h1 data-i18n="disk.title"></h1>
        <div class="actions">
          <button id="btn-disk-scan" class="ghost" data-i18n="disk.scan"></button>
          <button id="btn-disk-suggest" class="ghost" data-i18n="disk.selectSuggested"></button>
          <button id="btn-disk-clean" class="danger" data-i18n="disk.clean"></button>
        </div>
      </header>
      <p class="hint" data-i18n="disk.hint"></p>
      <div id="disk-auto" class="autobar">
        <b data-i18n="disk.auto.title"></b>
        <label><span data-i18n="disk.auto.days"></span> <select id="da-days"></select></label>
        <label><input type="checkbox" id="da-build" /> <span data-i18n="disk.auto.build"></span></label>
        <label><input type="checkbox" id="da-deps" /> <span data-i18n="disk.auto.deps"></span></label>
        <label><input type="checkbox" id="da-caches" /> <span data-i18n="disk.auto.caches"></span></label>
        <label><span data-i18n="disk.auto.min"></span> <select id="da-min"></select></label>
      </div>
      <div id="disk-summary" class="summary"></div>
      <table class="tbl">
        <thead><tr>
          <th></th><th data-i18n="disk.col.what"></th><th data-i18n="disk.col.type"></th>
          <th class="num" data-i18n="disk.col.size"></th><th data-i18n="disk.col.info"></th><th></th>
        </tr></thead>
        <tbody id="disk-body"><tr><td colspan="6" class="loading">…</td></tr></tbody>
      </table>
    </section>

    <!-- HARDWARE -->
    <section id="tab-hardware" class="tab">
      <header><h1 data-i18n="hw.title"></h1><button id="btn-hw-refresh" class="ghost" data-i18n="common.refresh"></button></header>
      <p class="hint" data-i18n="hw.hint"></p>
      <h2 class="hw-h" data-i18n="hw.disks"></h2>
      <div id="hw-disks" class="hw-grid"><div class="card"><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span></div></div>
      <div id="hw-parts" class="hw-grid"><div class="card"><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span></div><div class="card"><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span></div><div class="card"><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span></div><div class="card"><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span></div></div>
    </section>

    <!-- BROWSER CLEANUP -->
    <section id="tab-browser" class="tab">
      <header>
        <h1 data-i18n="bc.title"></h1>
        <div class="actions">
          <button id="btn-bc-scan" class="ghost" data-i18n="bc.scan"></button>
          <button id="btn-bc-safe" class="ghost" data-i18n="bc.selectSafe"></button>
          <button id="btn-bc-clean" class="danger" data-i18n="bc.clean"></button>
        </div>
      </header>
      <p class="hint" data-i18n="bc.hint"></p>
      <div id="bc-summary" class="summary"></div>
      <table class="tbl">
        <thead><tr>
          <th></th><th data-i18n="bc.col.profile"></th><th data-i18n="bc.col.what"></th>
          <th data-i18n="bc.col.type"></th><th class="num" data-i18n="bc.col.size"></th>
        </tr></thead>
        <tbody id="bc-body"><tr><td colspan="5" class="loading">…</td></tr></tbody>
      </table>
    </section>

    <!-- BOOST REPORT -->
    <section id="tab-report" class="tab">
      <header>
        <h1 data-i18n="report.title"></h1>
        <div class="actions">
          <button id="btn-measure" class="primary" data-i18n="report.measure"></button>
          <button id="btn-copy-md" class="ghost" data-i18n="report.copy"></button>
          <button id="btn-clear-snaps" class="ghost" data-i18n="report.clear"></button>
        </div>
      </header>
      <p class="hint" data-i18n="report.hint"></p>
      <div class="pickers">
        <label><span data-i18n="report.before"></span> <select id="snap-before"></select></label>
        <span class="arrow">→</span>
        <label><span data-i18n="report.after"></span> <select id="snap-after"></select></label>
      </div>
      <div id="report-win" class="win hidden"></div>
      <div id="report-body"></div>
    </section>

    <!-- TWEAKS -->
    <section id="tab-tweaks" class="tab">
      <header>
        <h1 data-i18n="tw.title"></h1>
        <div class="actions">
          <button id="btn-select-safe" class="ghost" data-i18n="tw.selectSafe"></button>
          <button id="btn-apply-selected" class="primary" data-i18n="tw.applySel"></button>
          <button id="btn-reapply" class="ghost" data-i18n="tw.verify"></button>
        </div>
      </header>
      <p class="hint" id="tw-hint"></p>
      <div id="tweak-list"><div class="loading" data-i18n="tw.loading"></div></div>
    </section>

    <!-- PROCESSES -->
    <section id="tab-processes" class="tab">
      <header>
        <h1 data-i18n="proc.title"></h1>
        <div class="actions">
          <input id="proc-filter" type="search" data-i18n-ph="proc.filter" />
          <label class="chk"><input type="checkbox" id="proc-auto" checked /> <span data-i18n="proc.auto"></span></label>
          <button id="btn-refresh-proc" class="ghost" data-i18n="common.refresh"></button>
        </div>
      </header>
      <table class="tbl sticky">
        <thead><tr>
          <th data-sort="name" data-i18n="col.process"></th><th data-sort="pid" class="num" data-i18n="col.pid"></th>
          <th data-sort="cpu" class="num" data-i18n="col.cpu"></th><th data-sort="mem" class="num" data-i18n="col.ram"></th>
          <th data-sort="disk" class="num" data-i18n="col.disk"></th><th data-i18n="col.services"></th><th></th>
        </tr></thead>
        <tbody id="proc-body"></tbody>
      </table>
    </section>

    <!-- HISTORY -->
    <section id="tab-history" class="tab">
      <header>
        <h1 data-i18n="hist.title"></h1>
        <div class="actions">
          <button id="btn-export" class="ghost" data-i18n="hist.export"></button>
          <label class="btn ghost"><span data-i18n="hist.import"></span><input id="file-import" type="file" accept=".json" hidden /></label>
          <button id="btn-restore-all" class="danger" data-i18n="hist.restoreAll"></button>
        </div>
      </header>
      <p class="hint" id="backup-info"></p>
      <table class="tbl"><thead><tr>
        <th data-i18n="hist.col.time"></th><th data-i18n="hist.col.source"></th><th data-i18n="hist.col.tweak"></th>
        <th data-i18n="hist.col.action"></th><th data-i18n="hist.col.result"></th><th data-i18n="hist.col.detail"></th>
      </tr></thead><tbody id="hist-body"></tbody></table>
    </section>

    <!-- SETTINGS -->
    <section id="tab-settings" class="tab">
      <header><h1 data-i18n="set.title"></h1><button id="btn-save-settings" class="primary" data-i18n="common.save"></button></header>
      <div class="card form">
        <h2 data-i18n="set.general"></h2>
        <label class="chk"><input type="checkbox" id="s-startup" /> <span data-i18n="set.startup"></span></label>
        <label class="chk"><input type="checkbox" id="s-tray" /> <span data-i18n="set.tray"></span></label>
        <label><span data-i18n="set.watchdog"></span> <input type="number" id="s-watchdog" min="1" max="1440" /></label>
        <label><span data-i18n="set.idle"></span> <input type="number" id="s-idle" min="1" max="10080" /></label>
        <label class="chk"><input type="checkbox" id="s-autokill" /> <span data-i18n="set.autokill"></span></label>
        <label class="chk"><input type="checkbox" id="s-badge" /> <span data-i18n="set.badge"></span></label>
        <label><span data-i18n="set.badgeWarn"></span> <input type="number" id="s-badge-warn" min="0.1" max="256" step="0.5" /></label>
        <label><span data-i18n="set.badgeAlert"></span> <input type="number" id="s-badge-alert" min="0.1" max="256" step="0.5" /></label>
        <label><span data-i18n="set.folders"></span>
          <textarea id="s-folders" rows="6" spellcheck="false"></textarea>
        </label>
        <p class="hint" id="s-info"></p>
      </div>

      <div class="card form">
        <h2 data-i18n="set.disk"></h2>
        <label><span data-i18n="set.diskRoots"></span>
          <textarea id="s-disk-roots" rows="4" spellcheck="false"></textarea>
        </label>
        <label><span data-i18n="set.diskExcludes"></span>
          <textarea id="s-disk-excludes" rows="4" spellcheck="false" placeholder="D:\work\legacy-app&#10;vendor&#10;old-*"></textarea>
        </label>
        <label><span data-i18n="set.diskStale"></span> <input type="number" id="s-disk-stale" min="1" max="3650" /></label>
        <p class="hint" data-i18n="set.diskBuiltin"></p>
      </div>

      <div class="card form" id="upd-card">
        <h2 data-i18n="upd.title"></h2>
        <p class="hint" data-i18n="upd.hint"></p>
        <label class="chk"><input type="checkbox" id="s-autoupdate" /> <span data-i18n="upd.auto"></span></label>
        <div id="upd-status" class="sub"></div>
        <div id="upd-notes" class="upd-notes hidden"></div>
        <div class="actions">
          <button id="btn-upd-check" class="ghost" data-i18n="upd.check"></button>
          <button id="btn-upd-install" class="primary hidden" data-i18n="upd.install"></button>
        </div>
      </div>

      <div class="card form" id="av-card">
        <h2 data-i18n="av.title"></h2>
        <p class="hint" data-i18n="av.hint"></p>
        <div id="av-status" class="sub"></div>
        <div class="actions"><button id="btn-av" class="ghost"></button></div>
      </div>

      <div class="card form">
        <h2 data-i18n="chrome.title"></h2>
        <p class="hint" data-i18n="chrome.hint"></p>
        <div class="actions"><button id="btn-chrome" class="ghost" data-i18n="chrome.open"></button></div>
      </div>

      <div class="card form">
        <h2 data-i18n="disc.title"></h2>
        <p class="hint" data-i18n="disc.body"></p>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="ghost" data-i18n="common.cancel"></button>
        <button id="modal-ok" class="primary"></button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="i18n.js"></script>
  <script src="locales/de.js"></script>
  <script src="locales/es.js"></script>
  <script src="locales/fr.js"></script>
  <script src="locales/it.js"></script>
  <script src="locales/pt-BR.js"></script>
  <script src="locales/ru.js"></script>
  <script src="locales/ja.js"></script>
  <script src="locales/ko.js"></script>
  <script src="locales/zh-CN.js"></script>
  <script src="app.js"></script>
</body>
</html>
