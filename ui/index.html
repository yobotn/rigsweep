<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RigSweep</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img class="mark" src="mark.svg" alt="" /> RigSweep<div class="tagline" data-i18n="tagline"></div></div>
    <nav>
      <button data-tab="dashboard" data-group="home" class="active" data-i18n="nav.dashboard"></button>
      <button data-tab="cleanup" data-group="clean" data-i18n="nav.clean"></button>
      <button data-tab="tweaks" data-group="tune" data-i18n="nav.tune"></button>
      <button data-tab="hardware" data-group="pc" data-i18n="nav.pc"></button>
      <div class="nav-group"></div>
      <button data-tab="history" data-i18n="nav.history"></button>
      <button data-tab="settings" data-i18n="nav.settings"></button>
    </nav>
    <div class="side-foot">
      <button id="update-pill" class="pill update hidden"></button>
      <div id="watchdog-status" class="pill bad hidden"></div>
    </div>
  </aside>

  <main>
    <div id="admin-banner" class="banner bad hidden" role="alert"></div>
    <!-- DASHBOARD -->
    <section id="tab-dashboard" class="tab active">
      <header>
        <h1 data-i18n="dash.title"></h1>
        <div class="actions">
          <div class="label live-sub"><i class="pulse"></i><span data-i18n="live.now"></span></div>
          <button id="btn-refresh-dash" data-icon="refresh-cw" class="ghost" data-i18n="common.refresh"></button>
        </div>
      </header>
      <div class="attention">
        <div id="heat-callout" class="callouts"></div>
        <div id="hw-callout" class="callouts"></div>
        <div id="drift-callout" class="callouts"></div>
      </div>
      <div id="dash-space" class="space hidden"></div>
      <div class="card ready" id="ready">
        <h2 data-i18n="ready.title"></h2>
        <ul id="ready-list"></ul>
      </div>
      <div class="charts">
        <div class="card chart" id="c-cpu">
          <div class="chart-head">
            <div class="label"><i class="swatch cpu"></i><span data-i18n="dash.cpu"></span></div>
            <div class="sub" id="t-cpu-sub"></div>
          </div>
          <div class="value skel" id="t-cpu">–</div>
          <div class="chart-plot" id="p-cpu">
            <svg class="chart-svg cpu" viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true"></svg>
            <div class="chart-cursor hidden"></div><div class="chart-dot hidden"></div><div class="chart-tip hidden"></div>
            <div class="chart-empty sub hidden" data-i18n="dash.waiting"></div>
          </div>
        </div>
        <div class="card chart" id="c-mem">
          <div class="chart-head">
            <div class="label"><i class="swatch mem"></i><span data-i18n="dash.mem"></span></div>
            <div class="sub" id="t-mem-sub"></div>
          </div>
          <div class="value skel" id="t-mem">–</div>
          <div class="chart-plot" id="p-mem">
            <svg class="chart-svg mem" viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true"></svg>
            <div class="chart-cursor hidden"></div><div class="chart-dot hidden"></div><div class="chart-tip hidden"></div>
            <div class="chart-empty sub hidden" data-i18n="dash.waiting"></div>
          </div>
        </div>
        <div class="tile heat" id="t-heat-tile" role="button" tabindex="0" data-i18n-title="heat.unitHint">
          <div class="label" data-i18n="heat.title"></div>
          <div class="value skel" id="t-heat">–</div>
          <svg id="heat-spark" class="spark heat-spark" viewBox="0 0 300 28" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="sub" id="t-heat-sub"></div>
        </div>
      </div>
      <div class="grid2">
        <div class="card">
          <h2 data-i18n="dash.top"></h2>
          <table class="tbl"><thead><tr><th data-i18n="col.process"></th><th class="num" data-i18n="col.cpu"></th><th class="num" data-i18n="col.ram"></th><th class="num" data-i18n="col.disk"></th></tr></thead><tbody id="dash-top"><tr class="skel-row"><td colspan="4"><span class="skel-bar"></span></td></tr><tr class="skel-row"><td colspan="4"><span class="skel-bar"></span></td></tr><tr class="skel-row"><td colspan="4"><span class="skel-bar"></span></td></tr><tr class="skel-row"><td colspan="4"><span class="skel-bar"></span></td></tr><tr class="skel-row"><td colspan="4"><span class="skel-bar"></span></td></tr><tr class="skel-row"><td colspan="4"><span class="skel-bar"></span></td></tr></tbody></table>
        </div>
        <div class="card">
          <h2 data-i18n="dash.recent"></h2>
          <ul id="dash-history" class="feed"><li class="skel-row"><span class="skel-bar"></span></li><li class="skel-row"><span class="skel-bar"></span></li><li class="skel-row"><span class="skel-bar"></span></li><li class="skel-row"><span class="skel-bar"></span></li><li class="skel-row"><span class="skel-bar"></span></li></ul>
        </div>
      </div>
    </section>

    <!-- IMPACT -->
    <section id="tab-impact" class="tab">
      <header>
        <h1 data-i18n="impact.title"></h1>
        <div class="seg" role="radiogroup" id="im-period">
          <button role="radio" data-period="week" data-i18n="impact.week"></button>
          <button role="radio" data-period="month" data-i18n="impact.month"></button>
          <button role="radio" data-period="all" data-i18n="impact.all"></button>
        </div>
      </header>
      <div class="card impact" id="impact">
        <div class="impact-stats">
          <div><div class="label" data-i18n="impact.disk"></div><div class="big disk" id="im-disk">–</div><div class="sub" id="im-ai"></div></div>
          <div><div class="label" data-i18n="impact.ram"></div><div class="big ram" id="im-ram">–</div></div>
          <div><div class="label" data-i18n="impact.procs"></div><div class="big" id="im-procs">–</div><div class="sub" id="im-ran"></div></div>
          <div><div class="label" data-i18n="impact.cpuPeak"></div><div class="big cpu" id="im-cpu">–</div><div class="sub" data-i18n="impact.cpuPeakSub"></div></div>
          <div><div class="label" data-i18n="impact.cpuTime"></div><div class="big cpu" id="im-cputime">–</div><div class="sub" data-i18n="impact.cpuTimeSub"></div></div>
          <div><div class="label" data-i18n="impact.runs"></div><div class="big" id="im-runs">–</div></div>
        </div>
      </div>
      <div class="card impact">
        <h2 class="label" data-i18n="impact.top"></h2>
        <ul id="im-top"></ul>
        <div class="sub" id="im-since"></div>
      </div>
    </section>


    <!-- DEV CLEANUP -->
    <section id="tab-cleanup" class="tab">
      <header>
        <h1 data-i18n="clean.title"></h1>
        <div class="actions">
          <button id="btn-clean-scan" data-icon="scan-search" class="ghost" data-i18n="clean.scan"></button>
          <button id="btn-clean-stale" data-icon="list-checks" class="ghost" data-i18n="clean.selectStale"></button>
          <button id="btn-clean-end" data-icon="octagon-x" class="danger" data-i18n="clean.end"></button>
        </div>
      </header>
      <div class="intro"><p class="hint" data-i18n="clean.hint"></p><p class="hint" data-i18n="clean.hint.leftovers"></p></div>
      <div id="live" class="live">
        <div class="live-nums">
          <div><span class="k"><i class="swatch mem"></i><span data-i18n="col.ram">RAM</span></span> <b id="live-mem" dir="ltr">–</b></div>
          <div><span class="k"><i class="swatch cpu"></i><span data-i18n="col.cpu">CPU</span></span> <b id="live-cpu">–</b></div>
          <div id="live-heat-row" class="hidden"><span class="k">🌡</span> <b id="live-heat">–</b></div>
          <div class="sub" data-i18n="live.now"></div>
        </div>
        <svg id="live-spark" class="spark" viewBox="0 0 300 48" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="live-win" class="live-win hidden"></div>
      </div>
      <div id="clean-summary" class="summary"></div>
      <div class="card flush"><table class="tbl">
        <thead><tr>
          <th></th><th data-sort="what" data-i18n="clean.col.what"></th><th data-sort="project" data-i18n="clean.col.project"></th>
          <th data-sort="age" class="num" data-i18n="clean.col.age"></th><th data-sort="mem" class="num" data-i18n="clean.col.mem"></th><th data-sort="cpu" class="num" data-i18n="col.cpu"></th>
          <th data-sort="ports" data-sort-first="-1" data-i18n="clean.col.ports"></th><th data-sort="status" data-sort-first="-1" data-i18n="clean.col.status"></th><th></th>
        </tr></thead>
        <tbody id="clean-body"><tr><td colspan="9" class="loading"><span class="spinner"></span></td></tr></tbody>
      </table></div>
    </section>

    <!-- DEV DISK -->
    <section id="tab-disk" class="tab">
      <header>
        <h1 data-i18n="disk.title"></h1>
        <div class="actions">
          <button id="btn-disk-scan" data-icon="scan-search" class="ghost" data-i18n="disk.scan"></button>
          <button id="btn-disk-suggest" data-icon="list-checks" class="ghost" data-i18n="disk.selectSuggested"></button>
          <button id="btn-disk-all" data-icon="check" class="ghost" data-i18n="sel.all" data-i18n-title="disk.selAllTip"></button>
          <button id="btn-disk-none" data-icon="square" class="ghost" data-i18n="sel.none"></button>
          <button id="btn-disk-clean" data-icon="trash-2" class="danger" data-i18n="disk.clean"></button>
        </div>
      </header>
      <div class="intro"><p class="hint" data-i18n="disk.hint"></p><p class="hint" data-i18n="disk.hint.more"></p></div>
      <div id="disk-scope" class="autobar hidden" role="status"></div>
      <div id="disk-auto" class="autobar">
        <b data-i18n="disk.auto.title"></b>
        <label><span data-i18n="disk.auto.days"></span> <select id="da-days"></select></label>
        <label><input type="checkbox" id="da-build" /> <span data-i18n="disk.auto.build"></span></label>
        <label><input type="checkbox" id="da-deps" /> <span data-i18n="disk.auto.deps"></span></label>
        <label><input type="checkbox" id="da-caches" /> <span data-i18n="disk.auto.caches"></span></label>
        <label><span data-i18n="disk.auto.min"></span> <select id="da-min"></select></label>
      </div>
      <div id="disk-space" class="space hidden"></div>
      <div class="list-filter">
        <div id="disk-summary" class="summary"></div>
        <div class="seg" id="disk-view" role="radiogroup" data-i18n-aria="disk.view"></div>
      </div>
      <div id="disk-job" class="jobbar hidden">
        <div class="job-head">
          <b id="dj-title" role="status" aria-live="polite"></b>
          <span class="job-actions">
            <button id="dj-pause" class="small ghost"></button>
            <button id="dj-stop" data-icon="square" class="small danger" data-i18n="disk.job.stop"></button>
            <button id="dj-continue" data-icon="play" class="small primary" data-i18n="disk.job.continue"></button>
            <button id="dj-dismiss" class="small ghost" data-i18n="disk.job.dismiss"></button>
          </span>
        </div>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="dj-bar"></div></div>
        <div id="dj-stats" class="sub"></div>
        <div id="dj-file" class="sub job-file" dir="ltr"></div>
      </div>
      <div class="card flush"><table class="tbl">
        <thead><tr>
          <th></th><th data-sort="what" data-i18n="disk.col.what"></th><th data-sort="type" data-i18n="disk.col.type"></th>
          <th data-sort="size" class="num" data-i18n="disk.col.size"></th><th data-sort="idle" data-sort-first="-1" data-i18n="disk.col.info"></th><th></th>
        </tr></thead>
        <tbody id="disk-body"><tr><td colspan="6" class="loading"><span class="spinner"></span></td></tr></tbody>
      </table></div>
    </section>

    <!-- HARDWARE -->
    <section id="tab-hardware" class="tab">
      <header><h1 data-i18n="hw.title"></h1><button id="btn-hw-refresh" data-icon="refresh-cw" class="ghost" data-i18n="common.refresh"></button></header>
      <div class="intro"><p class="hint" data-i18n="hw.hint"></p></div>
      <h2 class="hw-h" data-i18n="hw.disks"></h2>
      <div id="hw-disks" class="hw-grid"><div class="card"><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span></div></div>
      <div id="hw-parts" class="hw-grid"><div class="card"><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span></div><div class="card"><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span></div><div class="card"><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span></div><div class="card"><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar"></span></div></div>
    </section>

    <!-- BROWSER CLEANUP -->
    <section id="tab-gpu" class="tab">
      <header><h1 data-i18n="gpu.title"></h1><div class="label live-sub"><i class="pulse"></i><span data-i18n="live.now"></span></div></header>
      <div class="intro"><p class="hint" data-i18n="gpu.hint"></p></div>
      <div id="gpu-adapters" class="hw-grid"><div class="card"><span class="skel-bar"></span><span class="skel-bar"></span></div></div>
      <div id="ai-card" class="card">
        <h2 data-i18n="ai.title"></h2>
        <p class="hint" data-i18n="ai.hint"></p>
        <div id="ai-list"></div>
      </div>
      <div id="gpu-procs-card" class="card flush"><table class="tbl">
        <thead><tr><th data-i18n="col.process"></th><th class="num" data-i18n="col.pid"></th><th class="num" data-i18n="gpu.col.util"></th>
          <th class="pro-only" data-i18n="gpu.col.engine"></th><th class="num" data-i18n="gpu.col.dedicated"></th><th class="num pro-only" data-i18n="gpu.col.shared"></th></tr></thead>
        <tbody id="gpu-body"><tr><td colspan="6" class="loading"><span class="spinner"></span></td></tr></tbody>
      </table></div>
    </section>

    <section id="tab-network" class="tab">
      <header><h1 data-i18n="net.title"></h1><div class="label live-sub"><i class="pulse"></i><span data-i18n="live.now"></span></div></header>
      <div class="intro"><p class="hint" data-i18n="net.hint"></p></div>
      <div id="net-ifaces" class="hw-grid"><div class="card"><span class="skel-bar"></span><span class="skel-bar"></span></div></div>
      <div class="card form">
        <h2 data-i18n="net.who.title"></h2>
        <div class="who-row">
          <label><span data-i18n="net.who.port"></span> <input id="who-port" type="number" min="1" max="65535" placeholder="3000" /></label>
          <button id="btn-who-port" class="ghost" data-icon="search" data-i18n="net.who.find"></button>
        </div>
        <div class="who-row">
          <label class="grow"><span data-i18n="net.who.path"></span> <input id="who-path" type="text" spellcheck="false" placeholder="C:\work\app\node_modules" /></label>
          <button id="btn-who-path" class="ghost" data-icon="file-search" data-i18n="net.who.find"></button>
        </div>
        <div id="who-out"></div>
      </div>
      <div class="card flush"><table class="tbl">
        <thead><tr><th data-i18n="col.process"></th><th class="num" data-i18n="col.pid"></th><th data-i18n="net.col.listen"></th>
          <th class="num" data-i18n="net.col.est"></th><th data-i18n="net.col.remotes"></th></tr></thead>
        <tbody id="net-body"><tr><td colspan="5" class="loading"><span class="spinner"></span></td></tr></tbody>
      </table></div>
    </section>

    <section id="tab-finders" class="tab">
      <header><h1 data-i18n="fd.title"></h1></header>
      <div class="intro"><p class="hint" data-i18n="fd.hint"></p></div>
      <div class="card" id="fd-space">
        <header class="fd-head"><h2 data-i18n="fd.space.title"></h2>
          <span class="fd-space-pick"><select id="fd-space-drive" data-i18n-aria="fd.space.drive"></select><button class="ghost" id="fd-space-scan" data-icon="scan-search" data-i18n="fd.scan"></button></span></header>
        <p class="hint" data-i18n="fd.space.hint"></p>
        <div class="fd-out" id="fd-space-out"></div>
      </div>
      <div class="card" id="fd-move">
        <header class="fd-head"><h2 data-i18n="fd.move.title"></h2><button class="ghost" id="fd-move-scan" data-icon="scan-search" data-i18n="fd.scan"></button></header>
        <p class="hint" data-i18n="fd.move.hint"></p>
        <div class="fd-out" id="fd-move-out"></div>
      </div>
      <div class="card" id="fd-progs">
        <header class="fd-head"><h2 data-i18n="fd.progs.title"></h2><button class="ghost" data-fd-scan="progs" data-icon="scan-search" data-i18n="fd.scan"></button></header>
        <p class="hint" data-i18n="fd.progs.hint"></p>
        <div class="fd-out" id="fd-progs-out"></div>
      </div>
      <div class="card" id="fd-old">
        <header class="fd-head"><h2 data-i18n="fd.old.title"></h2><button class="ghost" data-fd-scan="old" data-icon="scan-search" data-i18n="fd.scan"></button></header>
        <p class="hint" data-i18n="fd.old.hint"></p>
        <div class="fd-out" id="fd-old-out"></div>
      </div>
      <div class="card" id="fd-look">
        <header class="fd-head"><h2 data-i18n="fd.look.title"></h2><button class="ghost" data-fd-scan="look" data-icon="scan-search" data-i18n="fd.scan"></button></header>
        <p class="hint" data-i18n="fd.look.hint"></p>
        <div class="fd-out" id="fd-look-out"></div>
      </div>
    </section>

    <section id="tab-browser" class="tab">
      <header>
        <h1 data-i18n="bc.title"></h1>
        <div class="actions">
          <button id="btn-bc-scan" data-icon="scan-search" class="ghost" data-i18n="bc.scan"></button>
          <button id="btn-bc-safe" data-icon="list-checks" class="ghost" data-i18n="bc.selectSafe"></button>
          <button id="btn-bc-all" data-icon="check" class="ghost" data-i18n="sel.all"></button>
          <button id="btn-bc-none" data-icon="square" class="ghost" data-i18n="sel.none"></button>
          <button id="btn-bc-clean" data-icon="trash-2" class="danger" data-i18n="bc.clean"></button>
        </div>
      </header>
      <div class="intro"><p class="hint" data-i18n="bc.hint"></p></div>
      <div id="bc-space" class="space hidden"></div>
      <div id="bc-summary" class="summary"></div>
      <div class="card flush"><table class="tbl">
        <thead><tr>
          <th></th><th data-sort="profile" data-i18n="bc.col.profile"></th><th data-sort="what" data-i18n="bc.col.what"></th>
          <th data-sort="type" data-i18n="bc.col.type"></th><th data-sort="size" class="num" data-i18n="bc.col.size"></th><th></th>
        </tr></thead>
        <tbody id="bc-body"><tr><td colspan="6" class="loading"><span class="spinner"></span></td></tr></tbody>
      </table></div>
    </section>

    <!-- BOOST REPORT -->
    <section id="tab-report" class="tab">
      <header>
        <h1 data-i18n="report.title"></h1>
        <div class="actions">
          <button id="btn-measure" data-icon="gauge" class="primary" data-i18n="report.measure"></button>
          <button id="btn-copy-md" data-icon="copy" class="ghost" data-i18n="report.copy"></button>
          <div class="menu">
            <button class="ghost menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="common.moreActions">⋯</button>
            <div class="menu-list" role="menu" hidden>
              <button id="btn-clear-snaps" role="menuitem" class="danger-text" data-i18n="report.clear"></button>
            </div>
          </div>
        </div>
      </header>
      <div class="intro"><p class="hint" data-i18n="report.hint"></p></div>
      <div class="pickers">
        <label><span data-i18n="report.before"></span> <select id="snap-before"></select></label>
        <span class="arrow">→</span>
        <label><span data-i18n="report.after"></span> <select id="snap-after"></select></label>
      </div>
      <div id="report-win" class="win hidden"></div>
      <div id="report-body"></div>
    </section>

    <!-- TWEAKS -->
    <section id="tab-tweaks" class="tab">
      <header>
        <h1 data-i18n="tw.title"></h1>
        <div class="actions">
          <button id="btn-select-safe" data-icon="list-checks" class="ghost" data-i18n="tw.selectSafe"></button>
          <button id="btn-apply-selected" data-icon="zap" class="primary" data-i18n="tw.applySel"></button>
          <button id="btn-reapply" data-icon="shield-check" class="ghost" data-i18n="tw.verify"></button>
        </div>
      </header>
      <p class="hint" id="tw-hint"></p>
      <div id="tweak-list"><div class="loading"><span class="spinner"></span> <span data-i18n="tw.loading"></span></div></div>
    </section>

    <!-- CONSOLE POP-UPS -->
    <section id="tab-flashes" class="tab">
      <header>
        <h1 data-i18n="fl.title"></h1>
        <div class="actions">
          <span id="fl-status" class="label live-sub"></span>
          <button id="btn-fl-clear" data-icon="trash-2" class="ghost" data-i18n="fl.clear"></button>
        </div>
      </header>
      <div class="intro"><p class="hint" data-i18n="fl.hint"></p></div>
      <div class="card flush"><table class="tbl">
        <thead><tr><th data-i18n="fl.col.when"></th><th data-i18n="fl.col.what"></th><th data-i18n="fl.col.by"></th><th class="num" data-i18n="fl.col.dur"></th><th></th></tr></thead>
        <tbody id="fl-body"><tr><td colspan="5" class="loading"><span class="spinner"></span></td></tr></tbody>
      </table></div>
    </section>

    <!-- STARTUP -->
    <section id="tab-startup" class="tab">
      <header>
        <h1 data-i18n="st.title"></h1>
        <div class="actions">
          <input id="st-filter" type="search" data-i18n-ph="st.filter" />
          <button id="btn-st-scan" data-icon="refresh-cw" class="ghost" data-i18n="common.refresh"></button>
        </div>
      </header>
      <div class="intro"><p class="hint" data-i18n="st.hint"></p></div>
      <div id="st-summary" class="summary"></div>
      <div class="card flush"><table class="tbl">
        <thead><tr><th data-sort="what" data-i18n="st.col.what"></th><th data-sort="when" data-i18n="st.col.when"></th><th></th></tr></thead>
        <tbody id="st-body"><tr><td colspan="3" class="loading"><span class="spinner"></span></td></tr></tbody>
      </table></div>
      <div class="card">
        <h2 data-i18n="st.offList"></h2>
        <ul id="st-off" class="feed"></ul>
      </div>
    </section>

    <!-- PROCESSES -->
    <section id="tab-processes" class="tab">
      <header>
        <h1 data-i18n="proc.title"></h1>
        <div class="actions">
          <input id="proc-filter" type="search" data-i18n-ph="proc.filter" />
          <label class="chk"><input type="checkbox" id="proc-auto" checked /> <span data-i18n="proc.auto"></span></label>
          <button id="btn-refresh-proc" data-icon="refresh-cw" class="ghost" data-i18n="common.refresh"></button>
        </div>
      </header>
      <div class="card flush"><table class="tbl sticky">
        <thead><tr>
          <th data-sort="name" data-i18n="col.process"></th><th data-sort="pid" class="num" data-i18n="col.pid"></th>
          <th data-sort="cpu" class="num" data-i18n="col.cpu"></th><th data-sort="mem" class="num" data-i18n="col.ram"></th>
          <th data-sort="disk" class="num" data-i18n="col.disk"></th><th data-i18n="col.services"></th><th></th>
        </tr></thead>
        <tbody id="proc-body"><tr><td colspan="7" class="loading"><span class="spinner"></span></td></tr></tbody>
      </table></div>
    </section>

    <!-- HISTORY -->
    <section id="tab-history" class="tab">
      <header>
        <h1 data-i18n="hist.title"></h1>
        <div class="actions">
          <button id="btn-export" data-icon="save" class="ghost" data-i18n="hist.export"></button>
          <div class="menu">
            <button class="ghost menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="common.moreActions">⋯</button>
            <div class="menu-list" role="menu" hidden>
              <label role="menuitem" tabindex="-1"><span data-i18n="hist.import"></span><input id="file-import" type="file" accept=".json" hidden /></label>
              <button id="btn-restore-all" role="menuitem" class="danger-text" data-i18n="hist.restoreAll"></button>
            </div>
          </div>
        </div>
      </header>
      <p class="hint" id="backup-info"></p>
      <div class="card flush"><table class="tbl"><thead><tr>
        <th data-i18n="hist.col.time"></th><th data-i18n="hist.col.source"></th><th data-i18n="hist.col.tweak"></th>
        <th data-i18n="hist.col.action"></th><th data-i18n="hist.col.result"></th><th data-i18n="hist.col.detail"></th>
      </tr></thead><tbody id="hist-body"><tr><td colspan="6" class="loading"><span class="spinner"></span></td></tr></tbody></table></div>
    </section>

    <!-- SETTINGS -->
    <section id="tab-settings" class="tab">
      <header><h1 data-i18n="set.title"></h1><div id="set-saved" class="sub save-state" aria-live="polite"></div></header>
      <div class="subtabs" role="tablist" aria-label="Settings">
        <button role="tab" data-stab="general" data-i18n="set.tab.general"></button>
        <button role="tab" data-stab="look" data-i18n="set.tab.look"></button>
        <button role="tab" data-stab="cleanup" data-i18n="set.tab.cleanup"></button>
        <button role="tab" data-stab="disk" data-i18n="set.tab.disk"></button>
        <button role="tab" data-stab="defender" data-i18n="set.tab.defender"></button>
        <button role="tab" data-stab="privacy" data-i18n="set.tab.privacy"></button>
        <button role="tab" data-stab="about" data-i18n="set.tab.about"></button>
      </div>

      <div class="stab" role="tabpanel" data-stab-panel="general">
        <div class="card form autosave">
          <label class="chk"><input type="checkbox" id="s-startup" /> <span data-i18n="set.startup"></span></label>
          <label class="chk"><input type="checkbox" id="s-tray" /> <span data-i18n="set.tray"></span></label>
          <label><span data-i18n="set.watchdog"></span> <input type="number" id="s-watchdog" min="1" max="1440" /></label>
          <p class="hint" data-i18n="set.watchdogHint"></p>
          <label><span data-i18n="set.liveRefresh"></span> <input type="number" id="s-live" min="2" max="60" /></label>
          <label><span data-i18n="set.language"></span> <select id="lang-select"></select></label>
        </div>
        <div class="card form autosave" id="upd-card">
          <h2 data-i18n="upd.title"></h2>
          <p class="hint" data-i18n="upd.hint"></p>
          <label class="chk"><input type="checkbox" id="s-autoupdate" /> <span data-i18n="upd.auto"></span></label>
          <div id="upd-status" class="sub"></div>
          <div id="upd-notes" class="upd-notes hidden"></div>
          <div class="actions">
            <button id="btn-upd-check" data-icon="refresh-cw" class="ghost" data-i18n="upd.check"></button>
            <button id="btn-upd-install" data-icon="arrow-up" class="primary hidden" data-i18n="upd.install"></button>
          </div>
        </div>
      </div>

      <div class="stab" role="tabpanel" data-stab-panel="look" hidden>
        <div class="card form">
          <h2 data-i18n="look.mode"></h2>
          <div class="choice-row">
        <label class="choice"><input type="radio" name="p-mode" value="simple" /><span><b data-i18n="look.simple"></b><span class="sub" data-i18n="look.simpleHint"></span></span></label>
        <label class="choice"><input type="radio" name="p-mode" value="pro" /><span><b data-i18n="look.pro"></b><span class="sub" data-i18n="look.proHint"></span></span></label>
          </div>
        </div>
        <div class="card form">
          <h2 data-i18n="look.monitors"></h2>
          <p class="hint" data-i18n="look.monHint"></p>
          <div class="mon-list">
          <label class="chk"><input type="checkbox" data-mon="mon_gpu" /> <span><span data-i18n="mon.gpu"></span><span class="sub" data-i18n="mon.gpuHint"></span></span></label>
          <label class="chk"><input type="checkbox" data-mon="mon_ai" /> <span><span data-i18n="mon.ai"></span><span class="sub" data-i18n="mon.aiHint"></span></span></label>
          <label class="chk"><input type="checkbox" data-mon="mon_net" /> <span><span data-i18n="mon.net"></span><span class="sub" data-i18n="mon.netHint"></span></span></label>
          <label class="chk"><input type="checkbox" data-mon="mon_heat" /> <span><span data-i18n="mon.heat"></span><span class="sub" data-i18n="mon.heatHint"></span></span></label>
          <label class="chk"><input type="checkbox" data-mon="mon_flashes" /> <span><span data-i18n="mon.flashes"></span><span class="sub" data-i18n="mon.flashesHint"></span></span></label>
          <label class="chk"><input type="checkbox" data-mon="mon_disk_alerts" /> <span><span data-i18n="mon.disk_alerts"></span><span class="sub" data-i18n="mon.disk_alertsHint"></span></span></label>
          </div>
        </div>
      </div>
      <div class="stab" role="tabpanel" data-stab-panel="cleanup" hidden>
        <div class="card form autosave">
          <label><span data-i18n="set.idle"></span> <input type="number" id="s-idle" min="1" max="10080" /></label>
          <label class="chk"><input type="checkbox" id="s-autokill" /> <span data-i18n="set.autokill"></span></label>
          <label class="chk"><input type="checkbox" id="s-badge" /> <span data-i18n="set.badge"></span></label>
          <label><span data-i18n="set.badgeWarn"></span> <input type="number" id="s-badge-warn" min="0.5" max="256" step="0.5" /></label>
          <label><span data-i18n="set.badgeAlert"></span> <input type="number" id="s-badge-alert" min="0.5" max="256" step="0.5" /></label>
        </div>
      </div>

      <div class="stab" role="tabpanel" data-stab-panel="disk" hidden>
        <div class="card form autosave">
          <label><span data-i18n="set.diskRoots"></span>
            <textarea id="s-disk-roots" rows="4" spellcheck="false"></textarea>
          </label>
          <label><span data-i18n="set.diskExcludes"></span>
            <textarea id="s-disk-excludes" rows="4" spellcheck="false" placeholder="D:\work\legacy-app&#10;vendor&#10;old-*"></textarea>
          </label>
          <label><span data-i18n="set.diskStale"></span> <input type="number" id="s-disk-stale" min="1" max="3650" /></label>
          <label class="chk"><input type="checkbox" id="s-disk-auto" /> <span><span data-i18n="set.diskAuto"></span><span class="sub" data-i18n="set.diskAutoHint"></span></span></label>
          <label><span data-i18n="set.diskAutoLow"></span> <input type="number" id="s-disk-auto-low" min="0" max="4096" /></label>
          <p class="hint" data-i18n="set.diskBuiltin"></p>
        </div>
        <div class="card form" id="xm-card">
          <h2 data-i18n="xm.title"></h2>
          <p class="hint" id="xm-hint"></p>
          <div id="xm-status" class="sub"></div>
          <div class="actions"><button id="btn-xm" class="ghost"></button></div>
        </div>
      </div>

      <div class="stab" role="tabpanel" data-stab-panel="defender" hidden>
        <div class="card form autosave">
          <label><span data-i18n="set.folders"></span>
            <textarea id="s-folders" rows="6" spellcheck="false"></textarea>
          </label>
        </div>
        <div class="card form" id="av-card">
          <h2 data-i18n="av.title"></h2>
          <p class="hint" data-i18n="av.hint"></p>
          <div id="av-status" class="sub"></div>
          <div class="actions"><button id="btn-av" class="ghost"></button></div>
        </div>
      </div>

      <div class="stab" role="tabpanel" data-stab-panel="privacy" hidden>
        <div class="card form" id="share-card">
          <p class="hint" data-i18n="share.hint"></p>
          <label class="chk"><input type="checkbox" id="s-share" /> <span data-i18n="share.toggle"></span></label>
          <div id="share-status" class="sub"></div>
          <div class="actions">
            <button id="btn-share-preview" data-icon="eye" class="ghost" data-i18n="share.preview"></button>
            <button id="btn-share-reset" class="ghost" data-i18n="share.reset"></button>
          </div>
        </div>
      </div>

      <div class="stab" role="tabpanel" data-stab-panel="about" hidden>
        <div class="card form">
          <h2 data-i18n="chrome.title"></h2>
          <p class="hint" data-i18n="chrome.hint"></p>
          <div class="actions"><button id="btn-chrome" data-icon="globe" class="ghost" data-i18n="chrome.open"></button></div>
        </div>
        <div class="card form">
          <h2 data-i18n="disc.title"></h2>
          <p class="hint" data-i18n="disc.body"></p>
          <p class="hint" id="s-info"></p>
          <p class="hint" data-i18n="set.lucide"></p>
        </div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="ghost" data-i18n="common.cancel"></button>
        <button id="modal-ok" class="primary"></button>
      </div>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="locales/de.js"></script>
  <script src="locales/es.js"></script>
  <script src="locales/fr.js"></script>
  <script src="locales/it.js"></script>
  <script src="locales/pt-BR.js"></script>
  <script src="locales/ru.js"></script>
  <script src="locales/ja.js"></script>
  <script src="locales/ko.js"></script>
  <script src="locales/zh-CN.js"></script>
  <script src="locales/he.js"></script>
  <script src="locales/ar.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
