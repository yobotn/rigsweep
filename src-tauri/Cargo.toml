[package]
name = "rigsweep"
version = "0.7.4"
description = "Free resources on Windows dev machines cluttered by AI-agent sessions and stale dev processes"
license = "MIT"
repository = "https://github.com/yobotn/rigsweep"
edition = "2021"

[[bin]]
name = "rigsweep"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
sysinfo = "0.40"
winreg = "0.56"
chrono = "0.4"
anyhow = "1"
png = "0.18"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_NetworkManagement",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Wdk_Graphics_Direct3D",
] }
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
