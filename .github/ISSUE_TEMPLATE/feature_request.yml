name: 💡 Feature request
description: Suggest an idea for RigSweep. Others can vote on it with 👍.
title: "Feature: "
labels: ["enhancement", "feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! First check the [ranked list of ideas](https://github.com/yobotn/rigsweep/issues?q=is%3Aissue+is%3Aopen+label%3Afeature-request+sort%3Areactions-%2B1-desc). If it's already there, a 👍 on that issue counts more than a new one.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is slow, cluttered or annoying on your machine today? Your dev stack and agents help a lot.
      placeholder: "When I close a Codex session, its MCP servers keep running and..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should RigSweep do about it?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety
      description: RigSweep never ends or deletes anything without confirmation and keeps changes reversible. What must this feature never touch?
  - type: input
    id: setup
    attributes:
      label: Your setup
      placeholder: "Windows 11, Node + Python, Claude Code, 32 GB RAM"
