# Builds the stats collector, tests it against a real Postgres, and uploads it plus the site (docs/)
# to the server over SSH and reloads it with pm2 (runs as the apps user; see server/deploy/README.md). Off until the repository variable DEPLOY_ENABLED is "true".
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key), DEPLOY_KNOWN_HOSTS (ssh-keyscan output).
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", "server/**", ".github/workflows/deploy.yml"]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # IndexNow compares with the commit before this push

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: server

      - name: Site checks (Markdown twins, OpenAPI, links)
        run: |
          node scripts/prerender-site.js --check
          node scripts/check-site.js

      - name: Test (real Postgres, no Docker)
        working-directory: server
        env:
          # postgresql_embedded downloads Postgres from GitHub releases; anonymous calls get rate limited
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test --locked

      - name: Build
        working-directory: server
        run: cargo build --release --locked

      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload site
        run: |
          rsync -az --delete --exclude CNAME --exclude .nojekyll \
            docs/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/rigsweep/site/"

      - name: Upload collector and reload (pm2)
        run: |
          target="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          scp server/target/release/rigsweep-stats "$target:/opt/rigsweep/bin/rigsweep-stats.new"
          scp server/deploy/ecosystem.config.js "$target:/opt/rigsweep/ecosystem.config.js"
          ssh "$target" 'chmod 755 /opt/rigsweep/bin/rigsweep-stats.new &&
            mv -f /opt/rigsweep/bin/rigsweep-stats.new /opt/rigsweep/bin/rigsweep-stats &&
            pm2 startOrReload /opt/rigsweep/ecosystem.config.js && pm2 save &&
            sleep 2 && curl -fsS http://127.0.0.1:2000/healthz'

      - name: IndexNow (ask Bing and the engines built on it to recrawl changed pages)
        if: github.event_name == 'push'
        continue-on-error: true
        run: node scripts/indexnow.js "${{ github.event.before }}"
