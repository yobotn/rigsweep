name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS syntax + translation keys
        run: |
          node -e "const fs=require('fs');for(const f of ['ui/app.js','ui/i18n.js','chrome-extension/popup.js','chrome-extension/background.js',...fs.readdirSync('ui/locales').map(f=>'ui/locales/'+f),...fs.readdirSync('docs/locales').map(f=>'docs/locales/'+f)])new Function(fs.readFileSync(f,'utf8'));"
          node scripts/check-i18n.js
