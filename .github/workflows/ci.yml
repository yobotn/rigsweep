name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: JS syntax + translation keys
        run: |
          node -e "const fs=require('fs');for(const f of ['ui/app.js','ui/i18n.js','chrome-extension/popup.js','chrome-extension/background.js',...fs.readdirSync('ui/locales').map(f=>'ui/locales/'+f),...fs.readdirSync('docs/locales').map(f=>'docs/locales/'+f)])new Function(fs.readFileSync(f,'utf8'));"
          node scripts/check-i18n.js
          node scripts/prerender-site.js --check
          node scripts/check-site.js
      - name: Extension stats test
        run: node scripts/test-extension-stats.js

  server:
    # the stats collector, against a real Postgres (postgresql_embedded, no Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: server
      - name: Server tests
        working-directory: server
        env:
          # postgresql_embedded downloads Postgres from GitHub releases; anonymous calls get rate limited
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test --locked

  site:
    # the website: WCAG 2.2 AA with axe in headless Chromium, and no breaking change to the public API spec
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # the API check compares with the commit before
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Accessibility (axe, every page)
        run: node scripts/check-a11y.js --all
      - name: OpenAPI breaking changes (oasdiff)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE:docs/openapi.json" 2>/dev/null; then echo "no earlier spec to compare"; exit 0; fi
          git show "$BASE:docs/openapi.json" > "$RUNNER_TEMP/base.json"
          docker run --rm -v "$RUNNER_TEMP:/base:ro" -v "$PWD/docs:/head:ro"             tufin/oasdiff:v1.38.0@sha256:d8e4cfbd36234af05c0d48f679005bace2a0253a93e5064158b720bf24ec4bd6             breaking /base/base.json /head/openapi.json --fail-on ERR
