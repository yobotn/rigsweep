name: Release

# Builds the Windows installer from the tagged source on GitHub-hosted runners.
# The unsigned installer is kept as a workflow artifact (the input for SignPath code signing)
# and attached to the GitHub Release for that tag, together with its updater signature (.sig)
# and latest.json, the file RigSweep's opt-in update check reads.
# Needs repo secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build installer (+ updater signature)
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Locate installer
        id: find
        shell: pwsh
        run: |
          $f = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          "path=$($f.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($f.Name)" >> $env:GITHUB_OUTPUT
          (Get-FileHash $f.FullName -Algorithm SHA256).Hash | Tee-Object -FilePath "$($f.FullName).sha256"
      - name: Upload unsigned installer (artifact for code signing)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: rigsweep-installer-unsigned
          path: |
            ${{ steps.find.outputs.path }}
            ${{ steps.find.outputs.path }}.sha256
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "RigSweep $($tag.TrimStart('v'))" --notes "Built by GitHub Actions from $tag." }
          $exe = "${{ steps.find.outputs.path }}"
          if (-not (Test-Path "$exe.sig")) { throw "No updater signature: set the TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) secrets" }
          $name = "${{ steps.find.outputs.name }}"
          # latest.json for the updater: version, notes from the release text, signed installer URL
          $notes = gh release view $tag --json body --jq .body
          $latest = [ordered]@{
            version  = $tag.TrimStart('v')
            notes    = ($notes -join "`n")
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{
              signature = (Get-Content "$exe.sig" -Raw).Trim()
              url       = "https://github.com/${{ github.repository }}/releases/download/$tag/$([uri]::EscapeDataString($name))"
            } }
          }
          $json = Join-Path $env:RUNNER_TEMP "latest.json"
          [IO.File]::WriteAllText($json, ($latest | ConvertTo-Json -Depth 5), (New-Object Text.UTF8Encoding $false))
          gh release upload $tag $exe "$exe.sha256" "$exe.sig" $json --clobber
