name: Release

# Builds the Windows installer from the tagged source on GitHub-hosted runners.
# The unsigned installer is kept as a workflow artifact (the input for SignPath code signing)
# and attached to the GitHub Release for that tag, together with its updater signature (.sig),
# latest.json (the file RigSweep's opt-in update check reads), a CycloneDX SBOM and a build
# provenance attestation (`gh attestation verify <exe> -R yobotn/rigsweep`).
# Needs repo secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# No build caches here: a release is built from scratch, so a poisoned cache can't reach it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # create the release and upload the installer
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4 (caches only with `cache:`, unset) # zizmor: ignore[cache-poisoning]
        with:
          node-version: 20
      - run: npm ci
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build installer (+ updater signature)
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Locate installer
        id: find
        shell: pwsh
        run: |
          $f = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          "path=$($f.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($f.Name)" >> $env:GITHUB_OUTPUT
          (Get-FileHash $f.FullName -Algorithm SHA256).Hash | Tee-Object -FilePath "$($f.FullName).sha256"
      - name: SBOM (CycloneDX, from Cargo.lock and package-lock.json)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: rigsweep-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Provenance attestation (SLSA build level 2)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.find.outputs.path }}
      - name: Upload unsigned installer (artifact for code signing)
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rigsweep-installer-unsigned
          path: |
            ${{ steps.find.outputs.path }}
            ${{ steps.find.outputs.path }}.sha256
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          EXE: ${{ steps.find.outputs.path }}
          EXE_NAME: ${{ steps.find.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          $tag = $env:TAG
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "RigSweep $($tag.TrimStart('v'))" --notes "Built by GitHub Actions from $tag." }
          $exe = $env:EXE
          if (-not (Test-Path "$exe.sig")) { throw "No updater signature: set the TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) secrets" }
          $name = $env:EXE_NAME
          # latest.json for the updater: version, notes from the release text, signed installer URL
          $notes = gh release view $tag --json body --jq .body
          $latest = [ordered]@{
            version  = $tag.TrimStart('v')
            notes    = ($notes -join "`n")
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{
              signature = (Get-Content "$exe.sig" -Raw).Trim()
              url       = "https://github.com/$($env:REPO)/releases/download/$tag/$([uri]::EscapeDataString($name))"
            } }
          }
          $json = Join-Path $env:RUNNER_TEMP "latest.json"
          [IO.File]::WriteAllText($json, ($latest | ConvertTo-Json -Depth 5), (New-Object Text.UTF8Encoding $false))
          gh release upload $tag $exe "$exe.sha256" "$exe.sig" $json rigsweep-sbom.cdx.json --clobber
