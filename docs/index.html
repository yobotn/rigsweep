    :root {

      --r-sm: 8px; --r: 14px; --r-lg: 18px;

      --shadow: 0 24px 64px rgba(0,0,0,.55);
      --font: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
      color-scheme: dark;

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 var(--font); -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; }

    /* ---------- nav ---------- */
    .nav { position: sticky; top: 0; z-index: 10; background: rgba(11,14,19,.82); backdrop-filter: blur(10px); border-bottom: 1px solid transparent; }

    .nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); height: 64px; }
    .logo { font-weight: 700; font-size: 19px; color: var(--text); white-space: nowrap; }
    .logo:hover { text-decoration: none; }
    .links { display: flex; gap: var(--s3); align-items: center; font-size: 14px; }
    .links a { color: var(--muted); }
    .links a:hover { color: var(--text); text-decoration: none; }
    .lang { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; }
    .lang button { background: none; border: 0; color: var(--muted); padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
    .lang button.on { background: var(--panel2); color: var(--text); }

    /* ---------- buttons ---------- */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s1); min-height: 46px; padding: 0 22px;
      border-radius: var(--r-sm); font-weight: 600; border: 1px solid var(--border2); color: var(--text); background: var(--panel); transition: transform .15s, filter .15s; }

    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    /* ---------- screenshot frame: fixed aspect ratio, never stretched ---------- */
    .frame { background: var(--panel); border: 1px solid var(--border2); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
    .frame .bar { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; background: var(--bg2); border-bottom: 1px solid var(--border); }
    .frame .bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--border2); }
    .frame .bar span { margin-left: 10px; font-size: 12px; color: var(--muted); }
    .frame img { display: block; width: 100%; height: auto; aspect-ratio: 1240 / 820; object-fit: cover; object-position: top left; }

    /* ---------- sections ---------- */
    section { padding: var(--s5) 0 0; }

    h1, h2, h3 { letter-spacing: -0.015em; }

    .lead { color: var(--muted); font-size: 17px; max-width: 700px; margin: 0 0 var(--s4); }
    .center { text-align: center; }
    .center .lead { margin-left: auto; margin-right: auto; }

    .hero { text-align: center; padding: var(--s5) 0 0; }
    .badge-top { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 4px 14px; margin-bottom: var(--s3); background: var(--panel); }

    .hero .meta { margin-top: var(--s2); color: var(--muted); font-size: 13px; }
    .hero .frame { margin: var(--s4) auto 0; max-width: 1000px; }

    /* story */
    .story { display: grid; grid-template-columns: 1.15fr 1fr; gap: var(--s4); align-items: center; }
    .story p { margin: 0 0 var(--s2); color: var(--muted); }
    .story p strong { color: var(--text); }

    .stat { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); padding: 14px 0; border-bottom: 1px solid var(--border); }
    .stat:first-child { padding-top: 0; }
    .stat:last-of-type { border-bottom: 0; }
    .stat span { color: var(--muted); }
    .stat b { font-size: 24px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .cap { color: var(--muted); font-size: 12px; margin-top: var(--s1); }

    /* feature grid */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s1); }
    .card .ic { width: 44px; height: 44px; display: grid; place-items: center; font-size: 22px; border-radius: 12px; background: var(--panel2); }
    .card h3 { margin: var(--s1) 0 0; font-size: 18px; }
    .card p { margin: 0; color: var(--muted); font-size: 15px; }

    /* feature rows: text + framed screenshot, same proportions every time */
    .row { display: grid; grid-template-columns: 5fr 7fr; gap: var(--s4); align-items: center; }
    .row.flip { grid-template-columns: 7fr 5fr; }
    .row.flip .copy { order: 2; }
    .ticks { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .ticks li { position: relative; padding-left: 30px; color: var(--muted); }
    .ticks li::before { content: "✓"; position: absolute; left: 0; top: 1px; width: 20px; height: 20px; display: grid; place-items: center;
      font-size: 12px; font-weight: 700; border-radius: 50%; background: rgba(52,195,143,.15); color: var(--accent2); }
    .ticks li b { color: var(--text); }

    /* notes */
    .note { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--warn); border-radius: var(--r); padding: var(--s3); }
    .note p { margin: 0 0 12px; color: var(--muted); }
    .note p:last-child { margin: 0; }
    .note.disc { border-left-color: var(--muted); }

    .final { text-align: center; padding: var(--s5) var(--s3); margin-top: var(--s5); border-radius: var(--r-lg);
      background: radial-gradient(ellipse at top, rgba(79,140,255,.16), transparent 70%), var(--panel); border: 1px solid var(--border); }
    .final .lead { margin-bottom: var(--s3); }

    .signing { max-width: 680px; margin: var(--s4) auto 0; padding-top: var(--s3); border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
    .signing h3 { color: var(--text); font-size: 16px; margin: 0 0 var(--s1); }
    .signing p { margin: 0 0 var(--s1); }
    footer { margin-top: var(--s5); padding: var(--s3) 0 var(--s4); border-top: 1px solid var(--border); color: var(--muted); font-size: 14px;
      display: flex; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .story, .row, .row.flip { grid-template-columns: 1fr; gap: var(--s3); }
      .row.flip .copy { order: 0; }
    }
    @media (max-width: 600px) {
      :root { --s5: 56px; --s4: 32px; }
      .wrap { padding: 0 var(--s2); }
      .grid { grid-template-columns: 1fr; }
      .links a.hide-sm { display: none; }
      .links { gap: var(--s2); }
      .frame .bar { height: 26px; }
      .btn { width: 100%; }
    }
  </style>

    const IMG = { en: ["dashboard", "cleanup"], es: ["dashboard-es", "cleanup-es"], fr: ["dashboard-fr", "cleanup-fr"] };

    function apply(lang) {
      if (!T[lang]) lang = "en";
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = T[lang][el.dataset.t] ?? T.en[el.dataset.t]));
      // trusted static strings from the table above (no user input)
      document.querySelectorAll("[data-t-html]").forEach((el) => (el.innerHTML = T[lang][el.dataset.tHtml] ?? T.en[el.dataset.tHtml]));
      document.querySelectorAll(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
      document.getElementById("img-dashboard").src = `screenshots/${IMG[lang][0]}.png`;
      document.getElementById("img-cleanup").src = `screenshots/${IMG[lang][1]}.png`;
      try { localStorage.setItem("lang", lang); } catch {}
    }
    document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => apply(b.dataset.lang)));
    let initial = "en";
    try { initial = localStorage.getItem("lang") || (navigator.language || "en").slice(0, 2); } catch {}
    apply(initial);
    const nav = document.getElementById("nav");
    addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 8), { passive: true });
