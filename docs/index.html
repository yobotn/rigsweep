<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RigSweep: room for your agents</title>
  <meta name="description" content="Free, open-source Windows app that frees RAM and CPU on dev machines cluttered by AI-agent sessions: stale dev-process cleanup for Node, Python, Java, .NET and more, reversible tweaks, real before/after reports." />
  <meta property="og:title" content="RigSweep: room for your agents" />
  <meta property="og:description" content="Free up RAM and CPU on Windows dev machines cluttered by AI-agent sessions. MIT, free forever." />
  <link rel="canonical" href="https://rigsweep.com/" />
  <meta property="og:url" content="https://rigsweep.com/" />
  <meta property="og:image" content="https://rigsweep.com/screenshots/cleanup.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧹</text></svg>" />
  <style>
    /* ---------- tokens ---------- */
    :root {
      --bg: #0b0e13; --bg2: #0f131a; --panel: #141922; --panel2: #1b2130; --border: #262e3f; --border2: #323c52;
      --text: #e8ebf1; --muted: #8e97ab; --accent: #4f8cff; --accent2: #34c38f; --warn: #f1b44c;
      --r-sm: 8px; --r: 14px; --r-lg: 18px;
      --s1: 8px; --s2: 16px; --s3: 24px; --s4: 40px; --s5: 72px;
      --shadow: 0 24px 64px rgba(0,0,0,.55);
      --font: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 var(--font); -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; }
    code { font-family: Consolas, ui-monospace, monospace; font-size: .9em; background: var(--panel2); border-radius: 5px; padding: 1px 6px; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--s3); }

    /* ---------- nav ---------- */
    .nav { position: sticky; top: 0; z-index: 10; background: rgba(11,14,19,.82); backdrop-filter: blur(10px); border-bottom: 1px solid transparent; }
    .nav.scrolled { border-bottom-color: var(--border); }
    .nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); height: 64px; }
    .logo { font-weight: 700; font-size: 19px; color: var(--text); white-space: nowrap; }
    .logo:hover { text-decoration: none; }
    .links { display: flex; gap: var(--s3); align-items: center; font-size: 14px; }
    .links a { color: var(--muted); }
    .links a:hover { color: var(--text); text-decoration: none; }
    .lang { border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--panel); color: var(--text); padding: 5px 8px; font: inherit; font-size: 13px; cursor: pointer; }

    /* ---------- buttons ---------- */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s1); min-height: 46px; padding: 0 22px;
      border-radius: var(--r-sm); font-weight: 600; border: 1px solid var(--border2); color: var(--text); background: var(--panel); transition: transform .15s, filter .15s; }
    .btn:hover { text-decoration: none; filter: brightness(1.12); transform: translateY(-1px); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    /* ---------- screenshot frame: fixed aspect ratio, never stretched ---------- */
    .frame { background: var(--panel); border: 1px solid var(--border2); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
    .frame .bar { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; background: var(--bg2); border-bottom: 1px solid var(--border); }
    .frame .bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--border2); }
    .frame .bar span { margin-left: 10px; font-size: 12px; color: var(--muted); }
    .frame img { display: block; width: 100%; height: auto; aspect-ratio: 1240 / 820; object-fit: cover; object-position: top left; }

    /* ---------- sections ---------- */
    section { padding: var(--s5) 0 0; }
    .eyebrow { display: inline-block; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: var(--s1); }
    h1, h2, h3 { letter-spacing: -0.015em; }
    h2 { font-size: clamp(26px, 3.4vw, 36px); line-height: 1.2; margin: 0 0 var(--s2); }
    .lead { color: var(--muted); font-size: 17px; max-width: 700px; margin: 0 0 var(--s4); }
    .center { text-align: center; }
    .center .lead { margin-left: auto; margin-right: auto; }

    /* hero */
    .hero { text-align: center; padding: var(--s5) 0 0; }
    .badge-top { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 4px 14px; margin-bottom: var(--s3); background: var(--panel); }
    .hero h1 { font-size: clamp(38px, 6.4vw, 66px); line-height: 1.06; margin: 0 0 var(--s3); }
    .hero h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p.sub { color: var(--muted); font-size: clamp(17px, 2.2vw, 20px); max-width: 700px; margin: 0 auto var(--s4); }
    .hero .meta { margin-top: var(--s2); color: var(--muted); font-size: 13px; }
    .hero .frame { margin: var(--s4) auto 0; max-width: 1000px; }

    /* ecosystem strip */
    .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); font-size: 14px; white-space: nowrap; }

    /* story */
    .story { display: grid; grid-template-columns: 1.15fr 1fr; gap: var(--s4); align-items: center; }
    .story p { margin: 0 0 var(--s2); color: var(--muted); }
    .story p strong { color: var(--text); }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: var(--s3); }
    .stat { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); padding: 14px 0; border-bottom: 1px solid var(--border); }
    .stat:first-child { padding-top: 0; }
    .stat:last-of-type { border-bottom: 0; }
    .stat span { color: var(--muted); }
    .stat b { font-size: 24px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .cap { color: var(--muted); font-size: 12px; margin-top: var(--s1); }

    /* feature grid */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s1); }
    .card .ic { width: 44px; height: 44px; display: grid; place-items: center; font-size: 22px; border-radius: 12px; background: var(--panel2); }
    .card h3 { margin: var(--s1) 0 0; font-size: 18px; }
    .card p { margin: 0; color: var(--muted); font-size: 15px; }

    /* feature rows: text + framed screenshot, same proportions every time */
    .row { display: grid; grid-template-columns: 5fr 7fr; gap: var(--s4); align-items: center; }
    .row.flip { grid-template-columns: 7fr 5fr; }
    .row.flip .copy { order: 2; }
    .ticks { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .ticks li { position: relative; padding-left: 30px; color: var(--muted); }
    .ticks li::before { content: "✓"; position: absolute; left: 0; top: 1px; width: 20px; height: 20px; display: grid; place-items: center;
      font-size: 12px; font-weight: 700; border-radius: 50%; background: rgba(52,195,143,.15); color: var(--accent2); }
    .ticks li b { color: var(--text); }

    /* notes */
    .note { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--warn); border-radius: var(--r); padding: var(--s3); }
    .note p { margin: 0 0 12px; color: var(--muted); }
    .note p:last-child { margin: 0; }
    .note.disc { border-left-color: var(--muted); }

    .final { text-align: center; padding: var(--s5) var(--s3); margin-top: var(--s5); border-radius: var(--r-lg);
      background: radial-gradient(ellipse at top, rgba(79,140,255,.16), transparent 70%), var(--panel); border: 1px solid var(--border); }
    .final .lead { margin-bottom: var(--s3); }

    .signing { max-width: 680px; margin: var(--s4) auto 0; padding-top: var(--s3); border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
    .signing h3 { color: var(--text); font-size: 16px; margin: 0 0 var(--s1); }
    .signing p { margin: 0 0 var(--s1); }
    footer { margin-top: var(--s5); padding: var(--s3) 0 var(--s4); border-top: 1px solid var(--border); color: var(--muted); font-size: 14px;
      display: flex; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .story, .row, .row.flip { grid-template-columns: 1fr; gap: var(--s3); }
      .row.flip .copy { order: 0; }
    }
    @media (max-width: 600px) {
      :root { --s5: 56px; --s4: 32px; }
      .wrap { padding: 0 var(--s2); }
      .grid { grid-template-columns: 1fr; }
      .links a.hide-sm { display: none; }
      .links { gap: var(--s2); }
      .frame .bar { height: 26px; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <nav class="nav" id="nav">
    <div class="wrap">
      <a class="logo" href="#">🧹 RigSweep</a>
      <div class="links">
        <a class="hide-sm" href="#features" data-t="nav.features"></a>
        <a class="hide-sm" href="#trust" data-t="nav.trust"></a>
        <a href="https://github.com/yobotn/rigsweep">GitHub</a>
        <select class="lang" id="lang" aria-label="Language"></select>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <header class="hero">
      <div class="badge-top" data-t="hero.badge"></div>
      <h1 data-t-html="hero.title"></h1>
      <p class="sub" data-t="hero.sub"></p>
      <div class="cta">
        <a class="btn primary" href="https://github.com/yobotn/rigsweep/releases/latest" data-t="cta.download"></a>
        <a class="btn" href="https://github.com/yobotn/rigsweep" data-t="cta.source"></a>
      </div>
      <div class="meta" data-t="hero.meta"></div>
      <div class="frame">
        <div class="bar"><i></i><i></i><i></i><span>RigSweep</span></div>
        <img id="img-hero" src="screenshots/cleanup.png" alt="RigSweep Dev Cleanup" />
      </div>
    </header>

    <section class="center">
      <span class="eyebrow" data-t="eco.eyebrow"></span>
      <h2 data-t="eco.h"></h2>
      <p class="lead" data-t="eco.p"></p>
      <div class="chips">
        <span class="chip">⬢ Node · Bun · Deno</span><span class="chip">🐍 Python</span><span class="chip">☕ Java · Gradle · Maven</span>
        <span class="chip">🟣 .NET</span><span class="chip">💎 Ruby</span><span class="chip">🐘 PHP</span><span class="chip">🦀 Rust</span>
        <span class="chip">🐹 Go</span><span class="chip">🐧 WSL 2 · Docker</span><span class="chip">🤖 Claude Code · Codex · Gemini CLI · Aider</span>
      </div>
    </section>

    <section id="story">
      <div class="story">
        <div>
          <span class="eyebrow" data-t="story.eyebrow"></span>
          <h2 data-t="story.h"></h2>
          <p data-t="story.p1"></p>
          <p data-t="story.p2"></p>
          <p data-t-html="story.p3"></p>
        </div>
        <div class="panel">
          <div class="stat"><span data-t="stat.chrome"></span><b>6.5 GB</b></div>
          <div class="stat"><span data-t="stat.node"></span><b>2.5 GB</b></div>
          <div class="stat"><span data-t="stat.services"></span><b>~150</b></div>
          <div class="cap" data-t="stat.cap"></div>
        </div>
      </div>
    </section>

    <section id="features">
      <span class="eyebrow" data-t="feat.eyebrow"></span>
      <h2 data-t="feat.h"></h2>
      <p class="lead" data-t="feat.lead"></p>
      <div class="grid">
        <div class="card"><div class="ic">🧹</div><h3 data-t="f1.h"></h3><p data-t="f1.p"></p></div>
        <div class="card"><div class="ic">📊</div><h3 data-t="f2.h"></h3><p data-t="f2.p"></p></div>
        <div class="card"><div class="ic">🌐</div><h3 data-t="f3.h"></h3><p data-t="f3.p"></p></div>
        <div class="card"><div class="ic">⚙️</div><h3 data-t="f4.h"></h3><p data-t="f4.p"></p></div>
        <div class="card"><div class="ic">🔍</div><h3 data-t="f5.h"></h3><p data-t="f5.p"></p></div>
        <div class="card"><div class="ic">🌍</div><h3 data-t="f6.h"></h3><p data-t="f6.p"></p></div>
        <div class="card"><div class="ic">🌡️</div><h3 data-t="f7.h"></h3><p data-t="f7.p"></p></div>
        <div class="card"><div class="ic">🔄</div><h3 data-t="f8.h"></h3><p data-t="f8.p"></p></div>
        <div class="card"><div class="ic">🧽</div><h3 data-t="f9.h"></h3><p data-t="f9.p"></p></div>

    </section>

    <section>
      <div class="row">
        <div class="copy">
          <span class="eyebrow" data-t="clean.eyebrow"></span>
          <h2 data-t="clean.h"></h2>
          <ul class="ticks">
            <li data-t-html="clean.l1"></li>
            <li data-t-html="clean.l2"></li>
            <li data-t-html="clean.l3"></li>
            <li data-t-html="clean.l4"></li>
            <li data-t-html="clean.l5"></li>
          </ul>
        </div>
        <div class="frame">
          <div class="bar"><i></i><i></i><i></i><span data-t="shot.dashboard"></span></div>
          <img id="img-dashboard" src="screenshots/dashboard.png" alt="RigSweep dashboard" loading="lazy" />

    <section>
      <div class="row flip">
        <div class="copy">
          <span class="eyebrow" data-t="safe.eyebrow"></span>
          <h2 data-t="safe.h"></h2>
          <ul class="ticks">
            <li data-t-html="safe.l1"></li>
            <li data-t-html="safe.l2"></li>
            <li data-t-html="safe.l3"></li>
            <li data-t-html="safe.l4"></li>
          </ul>
        </div>
        <div class="frame">
          <div class="bar"><i></i><i></i><i></i><span data-t="shot.tweaks"></span></div>
          <img src="screenshots/tweaks.png" alt="Reversible tweaks" loading="lazy" />
        </div>
      </div>
    </section>

    <section id="trust">
      <span class="eyebrow" data-t="trust.eyebrow"></span>
      <h2 data-t="trust.h"></h2>
      <div class="note">
        <p data-t-html="trust.p1"></p>
        <p data-t-html="trust.p2"></p>
      </div>
    </section>

    <section id="disclaimer">
      <h2 data-t="disc.h"></h2>
      <div class="note disc"><p data-t="disc.p"></p></div>
    </section>

    <div class="final" id="download">
      <h2 data-t="start.h"></h2>
      <p class="lead" data-t="start.p"></p>
      <div class="cta">
        <a class="btn primary" href="https://github.com/yobotn/rigsweep/releases/latest" data-t="cta.download"></a>
        <a class="btn" href="https://github.com/yobotn/rigsweep#-build-from-source" data-t="cta.build"></a>
      </div>
      <div class="signing">
        <h3 data-t="sign.h"></h3>
        <p data-t="sign.p"></p>
        <a href="https://github.com/yobotn/rigsweep#-code-signing-policy" data-t="sign.link"></a>
      </div>
    </div>

    <footer>
      <div data-t="foot.l"></div>
      <div><a href="https://github.com/yobotn/rigsweep">GitHub</a> · <a href="https://github.com/yobotn/rigsweep/blob/main/LICENSE">MIT</a> · <a href="#disclaimer" data-t="foot.disc"></a> · <a href="https://github.com/yobotn/rigsweep/issues" data-t="foot.issues"></a></div>
    </footer>
  </main>

  <script src="locales/en.js"></script>
  <script src="locales/de.js"></script>
  <script src="locales/es.js"></script>
  <script src="locales/fr.js"></script>
  <script src="locales/it.js"></script>
  <script src="locales/pt-BR.js"></script>
  <script src="locales/ru.js"></script>
  <script src="locales/ja.js"></script>
  <script src="locales/ko.js"></script>
  <script src="locales/zh-CN.js"></script>
  <script>
    const LANGS = { "en": "English", "de": "Deutsch", "es": "Español", "fr": "Français", "it": "Italiano", "pt-BR": "Português (Brasil)", "ru": "Русский", "ja": "日本語", "ko": "한국어", "zh-CN": "简体中文" };
    // the Dashboard shot is a real capture (en/es/fr); the Dev Cleanup shot exists in every language
    const DASH = { en: "dashboard", es: "dashboard-es", fr: "dashboard-fr" };
    const ALIAS = { pt: "pt-BR", zh: "zh-CN" };
    const resolve = (tag) => {
      if (!tag) return null;
      if (T[tag]) return tag;
      const b = tag.split("-")[0].toLowerCase();
      return T[b] ? b : (T[ALIAS[b]] ? ALIAS[b] : null);
    };
    const sel = document.getElementById("lang");
    sel.innerHTML = Object.entries(LANGS).filter(([c]) => T[c]).map(([c, n]) => `<option value="${c}">${n}</option>`).join("");

    function apply(lang) {
      if (!T[lang]) lang = "en";
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = T[lang][el.dataset.t] ?? T.en[el.dataset.t]));
      // trusted static strings from docs/locales (no user input)
      document.querySelectorAll("[data-t-html]").forEach((el) => (el.innerHTML = T[lang][el.dataset.tHtml] ?? T.en[el.dataset.tHtml]));
      sel.value = lang;
      document.getElementById("img-dashboard").src = `screenshots/${DASH[lang] || DASH.en}.png`;
      document.getElementById("img-hero").src = `screenshots/${lang === "en" ? "cleanup" : "cleanup-" + lang}.png`;
      try { localStorage.setItem("lang", lang); } catch {}
    }
    sel.addEventListener("change", () => apply(sel.value));
    let saved = null;
    try { saved = localStorage.getItem("lang"); } catch {}
    apply(resolve(saved) || (navigator.languages || [navigator.language]).map(resolve).find(Boolean) || "en");
    const nav = document.getElementById("nav");
    addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 8), { passive: true });
  </script>
</body>
</html>
