        "trust.p1": "RigSweep est open source mais pas encore signé. Les outils qui modifient des services ressemblent à des malwares pour l'heuristique d'apprentissage automatique, donc Defender peut le signaler à tort (ex. <code>Trojan:Win32/Bearfoos!ml</code>, où <code>!ml</code> désigne une supposition heuristique).",
        "trust.p2": "L'installateur <b>demande</b> si vous voulez exclure uniquement son propre dossier, et le désinstallateur retire cette exclusion. La signature de code via SignPath Foundation est prévue. <a href=\"https://github.com/yobotn/rigsweep/blob/main/README.fr.md#%EF%B8%8F-faux-positifs-antivirus\">Lire la FAQ complète →</a>",
        "start.h": "🚀 Donnez de la place à vos agents", "start.p": "Installez, prenez une mesure de référence, balayez, puis mesurez à nouveau.",
        "foot.l": "🧹 RigSweep · gratuit pour toujours sous licence MIT", "foot.issues": "Signaler un problème",
      },
    };
    const IMG = { en: ["dashboard", "cleanup"], es: ["dashboard-es", "cleanup-es"], fr: ["dashboard-fr", "cleanup-fr"] };

    function apply(lang) {
      if (!T[lang]) lang = "en";
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = T[lang][el.dataset.t] ?? T.en[el.dataset.t]));
      // trusted static strings from the table above (no user input)
      document.querySelectorAll("[data-t-html]").forEach((el) => (el.innerHTML = T[lang][el.dataset.tHtml] ?? T.en[el.dataset.tHtml]));
      document.querySelectorAll(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
      document.getElementById("hero-img").src = `screenshots/${IMG[lang][0]}.png`;
      document.getElementById("clean-img").src = `screenshots/${IMG[lang][1]}.png`;
      try { localStorage.setItem("lang", lang); } catch {}
    }
    document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => apply(b.dataset.lang)));
    let initial = "en";
    try { initial = localStorage.getItem("lang") || (navigator.language || "en").slice(0, 2); } catch {}
    apply(initial);
  </script>
</body>
